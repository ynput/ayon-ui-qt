[project]
name = "ayon-ui-qt"
version = "0.1.0"
description = "AYON Qt Widget Library Addon - UI components mimicking AYON frontend"
readme = "README.md"
requires-python = ">=3.9.1,<3.10"
dependencies = [
    "numpy>=2.0.2",
    "pillow>=11.3.0",
    "pyside6>=6.7.1",
    "pytest>=8.4.2",
    "pytest-mock>=3.15.1",
    "pytest-qt>=4.5.0",
    "pytest-regressions[image]>=2.8.3",
    "pytest-timeout>=2.4.0",
    "qtpy>=2.3.1",
    "ruff>=0.11.4",
]

[project.optional-dependencies]
test = ["pytest", "pytest-qt", "pytest-regressions[image]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "client"]

[build-system]
requires = ["poetry-core", "setuptools"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "client/ayon_ui_qt/**/*" }]
include = [
    { path = "client/ayon_ui_qt/*.json", format = [
        "sdist",
        "wheel",
    ] },
    { path = "client/ayon_ui_qt/vendor/resources/*.*", format = [
        "sdist",
        "wheel",
    ] },
]
exclude = ["client/ayon_ui_qt/old"]
